# Netlify 部署配置
# 说明：站点通过 Git 自动部署，每次 push 到 main 分支会自动构建并发布。

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 单页应用回退：任何路径都交给 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 带哈希的构建产物可以永久缓存；HTML 必须每次校验，避免看到旧版本
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
